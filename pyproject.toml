[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-py"
version = "0.1.4"
description = "Sentinel Recreated Face Authentication CLI & Enrollment Wizard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "dbus-python",
    "PyGObject",
    "numpy",
    "textual"
]

[project.scripts]
sentinel = "sentinel_py.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_py*"]
