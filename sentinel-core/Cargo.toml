[package]
name = "sentinel-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "enroll-test"
path = "src/bin/enroll_test.rs"

[[bin]]
name = "auth-test"
path = "src/bin/auth_test.rs"

[[bin]]
name = "bench-pipeline"
path = "src/bin/bench_pipeline.rs"

[lib]
name = "sentinel_core"
path = "src/lib.rs"

[dependencies]
ort = { version = "2.0.0-rc.9", features = ["download-binaries"] }
ndarray = "0.17"
image = { version = "0.25", features = ["jpeg", "png"] }
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
zbus = "4.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
npy = "0.4.0"
minifb = "0.27"
rand = "0.8"


[dev-dependencies]
approx = "0.5"

